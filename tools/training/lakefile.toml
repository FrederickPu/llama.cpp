name = "training"
version = "0.1.0"
defaultTargets = ["extract_data"]

[[require]]
name = "Canonical"
git = "https://github.com/FrederickPu/CanonicalLean.git"
rev = "fix-windows-dll"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Training"

[[lean_exe]]
name = "extract_data"
root = "Training.ExtractData"
supportInterpreter = true
